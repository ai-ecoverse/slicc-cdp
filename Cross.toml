[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends perl make && curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz | tar xz && cd openssl-3.4.1 && CC=x86_64-linux-musl-gcc ./Configure linux-x86_64 no-shared --prefix=/musl --openssldir=/musl/ssl && make -j$(nproc) && make install_sw && cd .. && rm -rf openssl-3.4.1",
]

[target.x86_64-unknown-linux-musl.env]
passthrough = ["OPENSSL_DIR", "OPENSSL_STATIC"]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends perl make && curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz | tar xz && cd openssl-3.4.1 && ./Configure linux-aarch64 no-shared --cross-compile-prefix=aarch64-linux-musl- --prefix=/musl --openssldir=/musl/ssl && make -j$(nproc) && make install_sw && cd .. && rm -rf openssl-3.4.1",
]

[target.aarch64-unknown-linux-musl.env]
passthrough = ["OPENSSL_DIR", "OPENSSL_STATIC"]
