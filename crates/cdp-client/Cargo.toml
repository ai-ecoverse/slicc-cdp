[package]
name = "slicc-cdp-client"
version = "0.0.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Shared CDP connection for slicc-cdp CLIs"
repository = "https://github.com/ai-ecoverse/slicc-cdp"
homepage = "https://github.com/ai-ecoverse/slicc-cdp"
readme = "README.md"
keywords = ["cdp", "chrome", "devtools", "websocket"]
categories = ["development-tools", "network-programming"]
publish = true

[lib]
name = "cdp_client"

[[test]]
name = "document-freshness"
path = "../../test/integration/document-freshness.rs"

[[test]]
name = "document-validation"
path = "../../test/integration/document-validation.rs"

[[test]]
name = "webmcp-stage1"
path = "../../test/integration/webmcp-stage1.rs"

[[test]]
name = "guard-domain-premise"
path = "../../test/integration/guard-domain-premise.rs"

[dependencies]
getrandom = "0.4"
serde_json = "1"
slicc-browsers = { git = "https://github.com/ai-ecoverse/slicc-browsers", rev = "3205de5fbc2845c57585e52a23c9d1958de94342", features = ["serde"] }
url = "2.5"
wasix-net = "0.1.2"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
libc = "0.2"
native-tls = "0.2"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
slicc-browsers = { git = "https://github.com/ai-ecoverse/slicc-browsers", rev = "3205de5fbc2845c57585e52a23c9d1958de94342", features = ["corpus"] }
