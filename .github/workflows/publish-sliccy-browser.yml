name: Publish sliccy-browser

on:
  push:
    branches: [main]
    paths:
      - packages/sliccy-browser/package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish when this version is not on npm
        id: publish
        working-directory: packages/sliccy-browser
        env:
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MAIN" != "true" ]; then
            echo "::error::${name}@${version} is not on npm, and only main publishes"
            exit 1
          fi
          npm publish --access public --ignore-scripts
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Tag the published commit
        env:
          NAME: ${{ steps.publish.outputs.name }}
          VERSION: ${{ steps.publish.outputs.version }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          tag="sliccy-browser-v${VERSION}"
          if [ "$PUBLISHED" = "true" ]; then
            sha="$GITHUB_SHA"
          else
            sha="$(npm view "${NAME}@${VERSION}" gitHead)"
          fi
          if [ -z "$sha" ]; then
            echo "::error::no gitHead for ${NAME}@${VERSION}"
            exit 1
          fi
          existing="$(git ls-remote origin "refs/tags/${tag}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$sha" ]; then
              echo "::warning::${tag} already points at ${existing}, not ${sha}; leaving it"
            else
              echo "${tag} already points at ${sha}"
            fi
            exit 0
          fi
          git fetch --no-tags origin "$sha"
          git push origin "${sha}:refs/tags/${tag}"
          echo "tagged ${tag} at ${sha}"
          echo "tagged \`${tag}\` at \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
