name: Filtered parent proof

on:
  push:
    branches: [investigate/609-chrome-stall]

permissions:
  contents: read

jobs:
  repeat:
    runs-on: cloud-run-job
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps}
          command -v Xvfb
      - run: npm run pretest
        env:
          CARGO_BUILD_JOBS: '4'
      - run: |
          for round in $(seq 1 100); do
            echo "Proof round $round: filtered-parent Chrome"
            node --import ./test/integration/ports.mjs --test --test-concurrency=1 --test-timeout=600000 test/integration/page-scope-filtered-parent-chrome.test.mjs
          done
        env:
          CI: 'true'
