name: "PR certification"
on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
      - "converted_to_draft"
      - "labeled"
      - "unlabeled"
  merge_group:
    types:
      - "checks_requested"
permissions:
  contents: "read"
env:
  SLICC_CDP_PORTS: "9300-9309"
  LEFTHOOK: "0"
defaults:
  run:
    shell: "bash"
concurrency:
  group: "${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cert-review-approved') && format('cert-pr-noop-{0}', github.run_id) || format('cert-pr-{0}', github.event.pull_request.number || github.event.merge_group.head_sha) }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  self:
    name: "cert-review-pr / self"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      checks: "read"
      pull-requests: "write"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        name: "Fetch event objects only"
        env:
          EVENT_SHA: "${{ github.sha }}"
        run: "git fetch --no-tags origin \"$EVENT_SHA\""
      -
        id: "guard"
        uses: "ai-ecoverse/slicc-shared-web/.github/actions/cert-self-guard@f342d7cf558c817ce517bbbbc4cc46df6eac2f97"
        with:
          paths: |
            .github/workflows/cert*.yml
            .github/workflows/cert*.yaml
            scripts/cert/**
            .gitattributes
            scripts/test-integration.mjs
            test/integration/test-arguments.mjs
            test/integration/ports.mjs
            .cert/proofs.json
            scripts/sign-macos.sh
            scripts/generate-notices.sh
            scripts/release-checksums.mjs
      -
        if: "${{ always() }}"
        env:
          RECEIPT: "${{ steps.guard.outputs.receipt }}"
        run: |
          mkdir -p evidence
          printf '%s\n' "$RECEIPT" > evidence/self.json
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-self-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence/self.json"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 90
  plan:
    name: "cert-review-pr / plan"
    needs: "self"
    if: "${{ always() && github.event_name == 'pull_request' }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "read"
    outputs:
      go: "${{ steps.plan.outputs.go }}"
      report: "${{ steps.plan.outputs.report }}"
      head: "${{ steps.plan.outputs.head }}"
      commit: "${{ steps.plan.outputs.commit }}"
      base: "${{ steps.plan.outputs.base }}"
      version: "${{ steps.plan.outputs.version }}"
      rust: "${{ steps.plan.outputs.rust }}"
      test_only: "${{ steps.plan.outputs.test_only }}"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        name: "Fetch event objects only"
        env:
          EVENT_SHA: "${{ github.sha }}"
        run: "git fetch --no-tags origin \"$EVENT_SHA\""
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        continue-on-error: true
        with:
          name: "cert-pr-self-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence"
      -
        id: "plan"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p evidence
          self=()
          if [ -s evidence/self.json ]; then self=(--self evidence/self.json); fi
          node scripts/gate.mjs pr-plan --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-plan.mjs --merge "$GITHUB_SHA" "${self[@]}" --out evidence/plan.json
      -
        name: "Main-owned named proof derivation"
        if: "${{ steps.plan.outputs.go == 'true' }}"
        run: "node scripts/gate.mjs pr-proofs --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-proofs.mjs --plan evidence/plan.json --out evidence/plan.json"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence/plan.json"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 90
  pack:
    name: "cert-review-pr / pack (${{ matrix.side }})"
    needs: "plan"
    if: "${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    permissions:
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        side:
          - "base"
          - "candidate"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence"
      -
        name: "Fetch planned source objects"
        run: "node --input-type=module -e 'import{readFileSync}from\"node:fs\";import{execFileSync}from\"node:child_process\";const p=JSON.parse(readFileSync(\"evidence/plan.json\"));for(const s of[p.commit,p.baseline.commit]){if(!/^[a-f0-9]{40}$/.test(s))throw Error(\"invalid planned source\");execFileSync(\"git\",[\"fetch\",\"--no-tags\",\"origin\",s],{stdio:\"inherit\"})}'"
      -
        name: "Exact Rust toolchain"
        env:
          RUST: "${{ needs.plan.outputs.rust }}"
          TARGET: "wasm32-wasip1"
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST" --target "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      -
        env:
          SIDE: "${{ matrix.side }}"
        run: "node scripts/gate.mjs pr-pack --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-pack.mjs --plan evidence/plan.json --side \"$SIDE\" --out .cert/pack"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-pack-${{ github.event.pull_request.number }}-${{ needs.plan.outputs.head }}-${{ github.run_attempt }}-${{ matrix.side }}"
          path: ".cert/pack/"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 90
  native:
    name: "cert-review-pr / native (${{ matrix.label }})"
    needs: "plan"
    if: "${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    permissions:
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            os: "macos-latest"
            target: "x86_64-apple-darwin"
            label: "darwin-amd64"
          -
            os: "macos-latest"
            target: "aarch64-apple-darwin"
            label: "darwin-arm64"
          -
            os: "ubuntu-latest"
            target: "x86_64-unknown-linux-musl"
            label: "linux-amd64"
          -
            os: "ubuntu-latest"
            target: "aarch64-unknown-linux-musl"
            label: "linux-arm64"
          -
            os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            label: "windows-amd64"
          -
            os: "windows-latest"
            target: "aarch64-pc-windows-msvc"
            label: "windows-arm64"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence"
      -
        name: "Fetch planned source objects"
        run: "node --input-type=module -e 'import{readFileSync}from\"node:fs\";import{execFileSync}from\"node:child_process\";const p=JSON.parse(readFileSync(\"evidence/plan.json\"));for(const s of[p.commit,p.baseline.commit]){if(!/^[a-f0-9]{40}$/.test(s))throw Error(\"invalid planned source\");execFileSync(\"git\",[\"fetch\",\"--no-tags\",\"origin\",s],{stdio:\"inherit\"})}'"
      -
        name: "Exact Rust toolchain"
        env:
          RUST: "${{ needs.plan.outputs.rust }}"
          TARGET: "${{ matrix.target }}"
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST" --target "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      -
        if: "${{ matrix.label == 'linux-amd64' }}"
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      -
        if: "${{ matrix.label == 'linux-arm64' }}"
        run: "cargo install cross --locked --version 0.2.5"
      -
        env:
          TARGET: "${{ matrix.target }}"
          LABEL: "${{ matrix.label }}"
        run: "node scripts/gate.mjs pr-pack --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-pack.mjs --plan evidence/plan.json --side candidate --target \"$TARGET\" --label \"$LABEL\" --out .cert/native-build"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}"
          path: ".cert/native-build/"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 90
  signing:
    name: "cert-review-pr / signing"
    needs:
      - "plan"
      - "native"
    if: "${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' && needs.native.result == 'success' }}"
    runs-on: "macos-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-darwin-amd64"
          path: ".cert/native/darwin-amd64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-darwin-arm64"
          path: ".cert/native/darwin-arm64"
      -
        name: "Verify exact Mach-O inputs before credential step"
        run: "node scripts/gate.mjs pr-native --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-native.mjs --plan evidence/plan.json --action sign-input --directory .cert/native --out .cert/sign-input"
      -
        name: "Sign and notarise; never execute inputs"
        env:
          APPLE_CERTIFICATE_BASE64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
          APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}"
          APPLE_API_KEY_ID: "${{ secrets.APPLE_API_KEY_ID }}"
          APPLE_API_KEY_ISSUER_ID: "${{ secrets.APPLE_API_KEY_ISSUER_ID }}"
          APPLE_API_KEY_P8_BASE64: "${{ secrets.APPLE_API_KEY_P8_BASE64 }}"
        run: "bash scripts/sign-macos.sh \"ai.sliccy.playwright-cli:.cert/sign-input/playwright-cli-darwin-amd64\" \"ai.sliccy.playwright-cli:.cert/sign-input/playwright-cli-darwin-arm64\" \"ai.sliccy.curlwright:.cert/sign-input/curlwright-darwin-amd64\" \"ai.sliccy.curlwright:.cert/sign-input/curlwright-darwin-arm64\""
      -
        run: "node scripts/gate.mjs pr-sign-output --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-sign-output.mjs --plan evidence/plan.json --directory .cert/sign-input --out .cert/signed"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-signed-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".cert/signed/"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 1
  collect:
    name: "cert-review-pr / collect"
    needs:
      - "plan"
      - "pack"
      - "native"
      - "signing"
    if: "${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' && needs.pack.result == 'success' && needs.native.result == 'success' && needs.signing.result == 'success' }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    permissions:
      contents: "read"
    env:
      CERT_PR_PACKS: "${{ github.workspace }}/.cert/pr-packs"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-pack-${{ github.event.pull_request.number }}-${{ needs.plan.outputs.head }}-${{ github.run_attempt }}-base"
          path: ".cert/pr-packs/base"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-pack-${{ github.event.pull_request.number }}-${{ needs.plan.outputs.head }}-${{ github.run_attempt }}-candidate"
          path: ".cert/pr-packs/candidate"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-darwin-amd64"
          path: ".cert/native/darwin-amd64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-darwin-arm64"
          path: ".cert/native/darwin-arm64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-linux-amd64"
          path: ".cert/native/linux-amd64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-linux-arm64"
          path: ".cert/native/linux-arm64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-windows-amd64"
          path: ".cert/native/windows-amd64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-native-${{ github.run_id }}-${{ github.run_attempt }}-windows-arm64"
          path: ".cert/native/windows-arm64"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-signed-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".cert/signed"
      -
        run: "node scripts/gate.mjs pr-native --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/pr-native.mjs --plan evidence/plan.json --directory .cert/native --signed .cert/signed --out .cert/pr-assets"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-assets-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".cert/pr-assets/"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 1
  rebuild:
    name: "cert-review-pr / rebuild"
    needs:
      - "plan"
      - "pack"
    if: "${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' && needs.pack.result == 'success' }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    permissions:
      contents: "read"
    env:
      CERT_PR_PACKS: "${{ github.workspace }}/.cert/pr-packs"
    steps:
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          fetch-depth: 0
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: 24
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "evidence"
      -
        name: "Fetch planned source objects"
        run: "node --input-type=module -e 'import{readFileSync}from\"node:fs\";import{execFileSync}from\"node:child_process\";const p=JSON.parse(readFileSync(\"evidence/plan.json\"));for(const s of[p.commit,p.baseline.commit]){if(!/^[a-f0-9]{40}$/.test(s))throw Error(\"invalid planned source\");execFileSync(\"git\",[\"fetch\",\"--no-tags\",\"origin\",s],{stdio:\"inherit\"})}'"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-pack-${{ github.event.pull_request.number }}-${{ needs.plan.outputs.head }}-${{ github.run_attempt }}-base"
          path: ".cert/pr-packs/base"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "cert-pr-pack-${{ github.event.pull_request.number }}-${{ needs.plan.outputs.head }}-${{ github.run_attempt }}-candidate"
          path: ".cert/pr-packs/candidate"
      -
        name: "Exact Rust toolchain"
        env:
          RUST: "${{ needs.plan.outputs.rust }}"
          TARGET: "wasm32-wasip1"
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST" --target "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      -
        name: "Main-owned rebuild on exact packs"
        run: "node scripts/gate.mjs rebuild --accept PASS,FAIL,INCOMPLETE -- node scripts/cert/rebuild.mjs --plan evidence/plan.json --out evidence/rebuild.json"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        if: "${{ always() }}"
        with:
          name: "cert-pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}-rebuild"
          path: |
            evidence/rebuild.json
            .cert/rebuild-*/
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 90
  guard:
    name: "cert-review-pr / guard"
    needs:
      - "plan"
      - "pack"
    if: "${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' && needs.pack.result == 'success' }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 90
    permissions:
      contents: "read"
    env:
      CERT_PR_PACKS: "${{ github.workspace }}/.cert/pr-packs"
    steps:
      -
        name: "Record cert job start"
        run: 'printf "CERT_SUITE_JOB_STARTED_MS=%s\n" "$(date +%s%3N)" >> "$GITHUB_ENV"'
      -
        name: "Main-owned control checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
