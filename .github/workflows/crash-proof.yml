name: Renderer crash proof

on:
  push:
    branches: [fix/609-renderer-crashed-fast-fail]

permissions:
  contents: read

jobs:
  regression:
    runs-on: cloud-run-job
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          git show 1bafee2:crates/cdp-client/src/cdp.rs > crates/cdp-client/src/cdp.rs
          cargo build --locked -j 4 -p slicc-cdp-client --example guard_bridge
          set +e
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 --test-name-pattern='native:' test/integration/renderer-crash-fake.test.mjs
          status=$?
          set -e
          test "$status" -ne 0
          git restore crates/cdp-client/src/cdp.rs
          cargo build --locked -j 4 -p slicc-cdp-client --example guard_bridge
          cargo build --locked -j 4 --target wasm32-wasip1 -p slicc-cdp-client --example guard_bridge
          cargo test --locked -j 4 -p slicc-cdp-client renderer_crash
          for round in $(seq 1 3); do
            echo "Renderer crash regression round $round"
            node --import ./test/integration/ports.mjs --test --test-concurrency=1 test/integration/renderer-crash-fake.test.mjs
          done
