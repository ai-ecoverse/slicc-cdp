name: Certification bios file transport self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Generate two complete 160 KiB data-only step outputs
        id: fixture
        run: |
          mkdir -p evidence
          node scripts/gate.mjs pr-bios-file-fixture --accept PASS -- node scripts/cert/pr-bios-file-fixture.mjs --action generate --out evidence/generated.json
      - name: Expand JSON strings in the script file and pass only stdin
        run: |
          node scripts/gate.mjs pr-bios-files --accept PASS -- node scripts/cert/pr-bios-files.mjs --directory evidence --out evidence/transport.json <<'EOF'
          {"base":${{ toJSON(steps.fixture.outputs.base) }},"candidate":${{ toJSON(steps.fixture.outputs.candidate) }}}
          EOF
      - name: Check every byte without normalization or truncation
        run: node scripts/gate.mjs pr-bios-file-fixture --accept PASS -- node scripts/cert/pr-bios-file-fixture.mjs --action check --directory evidence --out evidence/checked.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cert-bios-file-self-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 90
