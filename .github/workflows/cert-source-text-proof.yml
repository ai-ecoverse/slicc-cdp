name: Certification source text regression

on:
  pull_request:
    paths:
      - .gitattributes
      - test/integration/cert-source-text.test.mjs
      - .github/workflows/cert-source-text-proof.yml

permissions:
  contents: read

env:
  SLICC_CDP_PORTS: 9300-9309
  LEFTHOOK: '0'

jobs:
  text:
    name: cert-source-text-proof / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Candidate preserves checkout and archive blob bytes
        run: node --test --test-reporter=tap test/integration/cert-source-text.test.mjs > positive.log
      - name: Base attributes fail the actual digest assertion under autocrlf
        env:
          BASE: abd8578ab80cf69c8e36815f09e386d830f30d27
        run: |
          mkdir -p .cert/source-text-negative/test/integration
          cp test/integration/cert-source-text.test.mjs .cert/source-text-negative/test/integration/
          if git cat-file -e "$BASE:.gitattributes" 2>/dev/null; then
            git show "$BASE:.gitattributes" > .cert/source-text-negative/.gitattributes
          fi
          set +e
          node --test --test-reporter=tap .cert/source-text-negative/test/integration/cert-source-text.test.mjs > negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -x '# tests 1' negative.log
          grep -x '# fail 1' negative.log
          grep 'checkout lock digest must equal the immutable blob' negative.log
          if grep -q 'ERR_MODULE_NOT_FOUND\|ENOENT' negative.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cert-source-text-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            positive.log
            negative.log
          if-no-files-found: error
          retention-days: 90
