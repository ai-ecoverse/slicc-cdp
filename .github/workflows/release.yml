name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SLICC_CDP_PORTS: 9300-9309

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)" --target wasm32-wasip1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: npm run build:wasm

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect release
        id: version
        run: |
          git fetch origin --tags --force
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.released == 'true'

      - name: Publish crates
        if: steps.version.outputs.released == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if grep -q 'vendor/wasix-net' crates/cdp-client/Cargo.toml; then
            echo "slicc-cdp-client still depends on the vendored wasix-net path; skipping crates.io"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "slicc-cdp (https://github.com/ai-ecoverse/slicc-cdp)" "https://crates.io/api/v1/crates/slicc-cdp-client")
          if [ "$code" = "404" ]; then
            echo "slicc-cdp-client is not on crates.io yet; the first publish is manual"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "crates.io lookup for slicc-cdp-client returned $code"
            exit 1
          fi
          node scripts/gate.mjs publish-crates -- sh scripts/publish-crates.sh "${{ steps.version.outputs.version }}"

  build-binaries:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.release.outputs.version }}
      signing: true
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}

  upload-assets:
    needs: [release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Generate licence notices
        run: |
          node scripts/gate.mjs notices -- bash scripts/generate-notices.sh artifacts/THIRD-PARTY-NOTICES
          cp LICENSE artifacts/LICENSE
          cp install.sh artifacts/install.sh

      - name: Generate checksums for the complete asset set
        run: node scripts/gate.mjs release-checksums -- node scripts/release-checksums.mjs artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          gh release upload "$tag" artifacts/* --clobber

  verify-signatures:
    needs: [release, build-binaries]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: binaries-darwin-*
          merge-multiple: true

      - name: Verify codesign identity, strict signature and notarisation of every macOS binary
        run: |
          failed=0
          for entry in \
            ai.sliccy.playwright-cli:playwright-cli-darwin-amd64 \
            ai.sliccy.curlwright:curlwright-darwin-amd64 \
            ai.sliccy.playwright-cli:playwright-cli-darwin-arm64 \
            ai.sliccy.curlwright:curlwright-darwin-arm64; do
            identifier="${entry%%:*}"
            bin="${entry#*:}"
            echo "::group::${bin}"
            problems=""
            if [ ! -f "$bin" ]; then
              problems=" missing"
            else
              output=$(codesign -dv --verbose=2 "$bin" 2>&1) || problems="$problems codesign-display"
              echo "$output"
              echo "$output" | grep -q "Authority=Developer ID Application" || problems="$problems no-developer-id"
              echo "$output" | grep -q "Identifier=${identifier}" || problems="$problems wrong-identifier"
              codesign --verify --strict "$bin" || problems="$problems codesign-strict"
              output=$(spctl -a -vv -t install "$bin" 2>&1) || problems="$problems spctl-rejected"
              echo "$output"
              echo "$output" | grep -q "accepted" || problems="$problems not-accepted"
              echo "$output" | grep -q "source=Notarized Developer ID" || problems="$problems not-notarized"
            fi
            echo "::endgroup::"
            if [ -n "$problems" ]; then
              echo "::error::${bin}:${problems}"
              failed=1
            else
              echo "${bin}: signed by Developer ID as ${identifier}, strict, notarised"
            fi
          done
          exit "$failed"

  publish-release:
    needs: [release, upload-assets, verify-signatures]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify all assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          expected="playwright-cli-darwin-amd64 playwright-cli-darwin-arm64 playwright-cli-linux-amd64 playwright-cli-linux-arm64 playwright-cli-windows-amd64.exe playwright-cli-windows-arm64.exe curlwright-darwin-amd64 curlwright-darwin-arm64 curlwright-linux-amd64 curlwright-linux-arm64 curlwright-windows-amd64.exe curlwright-windows-arm64.exe SHA256SUMS install.sh LICENSE THIRD-PARTY-NOTICES"
          assets=$(gh release view "$tag" --json assets -q '.assets[].name' | sort | tr '\n' ' ' | sed 's/ $//')
          for name in $expected; do
            if ! echo "$assets" | grep -qw "$name"; then
              echo "missing asset: $name"
              exit 1
            fi
          done
          gh release edit "$tag" --draft=false --latest

  verify:
    needs: [release, publish-release]
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' && needs.publish-release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.release.outputs.version }}

  smoke:
    needs: publish-release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, bin: playwright-cli }
          - { os: macos-latest, bin: playwright-cli }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Install via one-liner
        run: curl -fsSL https://github.com/ai-ecoverse/slicc-cdp/releases/latest/download/install.sh | sh -s -- --dir /tmp/smoke-bin

      - name: Verify
        run: |
          /tmp/smoke-bin/playwright-cli --version
          /tmp/smoke-bin/curlwright --version
