name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cert-only:
        description: Skip the release and append the cert line for the latest npm version to its GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.cert-only && 'release-cert' || 'release' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && !inputs.cert-only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target wasm32-wasip1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: npm run build:wasm

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect release
        id: version
        run: |
          git fetch origin --tags --force
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.released == 'true'

      - name: Publish crates
        if: steps.version.outputs.released == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if grep -q 'vendor/wasix-net' crates/cdp-client/Cargo.toml; then
            echo "slicc-cdp-client still depends on the vendored wasix-net path; skipping crates.io"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "slicc-cdp (https://github.com/ai-ecoverse/slicc-cdp)" "https://crates.io/api/v1/crates/slicc-cdp-client")
          if [ "$code" = "404" ]; then
            echo "slicc-cdp-client is not on crates.io yet; the first publish is manual"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "crates.io lookup for slicc-cdp-client returned $code"
            exit 1
          fi
          sh scripts/publish-crates.sh "${{ steps.version.outputs.version }}"

  cert:
    needs: release
    if: always() && (needs.release.outputs.released == 'true' || inputs.cert-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Append the npm pack sha256 to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: '@ai-ecoverse/slicc-cdp'
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          version="${RELEASED:-$(npm view "$NAME" version)}"
          deadline=$(( $(date +%s) + 600 ))
          until head="$(npm view "${NAME}@${version}" gitHead 2>/dev/null)" && [ -n "$head" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::${NAME}@${version} has no gitHead on the registry"
              exit 1
            fi
            sleep 10
          done
          dir="$(mktemp -d)"
          file="$(cd "$dir" && npm pack "${NAME}@${version}" --silent)"
          sha="$(sha256sum "${dir}/${file}" | cut -d' ' -f1)"
          line="cert: ${NAME}@${version} sha256=${sha} gitHead=${head}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          tag="v${version}"
          body="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json body -q .body)"
          if printf '%s\n' "$body" | grep -qxF "$line"; then
            echo "${tag} already carries the cert line"
            exit 0
          fi
          printf '%s\n\n%s\n' "$body" "$line" > "${dir}/notes.md"
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file "${dir}/notes.md"

  build-binaries:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.release.outputs.version }}
      signing: true
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}

  upload-assets:
    needs: [release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Generate licence notices
        run: |
          bash scripts/generate-notices.sh artifacts/THIRD-PARTY-NOTICES
          cp LICENSE artifacts/LICENSE

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          cp install.sh artifacts/install.sh
          gh release upload "$tag" artifacts/* --clobber

  verify-signatures:
    needs: [release, build-binaries]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { label: darwin-amd64, identifier: ai.sliccy.playwright-cli, bin: playwright-cli-darwin-amd64 }
          - { label: darwin-amd64, identifier: ai.sliccy.curlwright, bin: curlwright-darwin-amd64 }
          - { label: darwin-arm64, identifier: ai.sliccy.playwright-cli, bin: playwright-cli-darwin-arm64 }
          - { label: darwin-arm64, identifier: ai.sliccy.curlwright, bin: curlwright-darwin-arm64 }
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: binaries-${{ matrix.label }}

      - name: Verify codesign identity
        run: |
          output=$(codesign -dv --verbose=2 "${{ matrix.bin }}" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Authority=Developer ID Application"
          echo "$output" | grep -q "Identifier=${{ matrix.identifier }}"

      - name: Verify codesign strict
        run: codesign --verify --strict "${{ matrix.bin }}"

      - name: Verify notarisation
        run: |
          output=$(spctl -a -vv -t install "${{ matrix.bin }}" 2>&1)
          echo "$output"
          echo "$output" | grep -q "accepted"
          echo "$output" | grep -q "source=Notarized Developer ID"

  publish-release:
    needs: [release, upload-assets, verify-signatures, cert]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify all assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          expected="playwright-cli-darwin-amd64 playwright-cli-darwin-arm64 playwright-cli-linux-amd64 playwright-cli-linux-arm64 playwright-cli-windows-amd64.exe playwright-cli-windows-arm64.exe curlwright-darwin-amd64 curlwright-darwin-arm64 curlwright-linux-amd64 curlwright-linux-arm64 curlwright-windows-amd64.exe curlwright-windows-arm64.exe SHA256SUMS install.sh LICENSE THIRD-PARTY-NOTICES"
          assets=$(gh release view "$tag" --json assets -q '.assets[].name' | sort | tr '\n' ' ' | sed 's/ $//')
          for name in $expected; do
            if ! echo "$assets" | grep -qw "$name"; then
              echo "missing asset: $name"
              exit 1
            fi
          done
          gh release edit "$tag" --draft=false --latest

  smoke:
    needs: publish-release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, bin: playwright-cli }
          - { os: macos-latest, bin: playwright-cli }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Install via one-liner
        run: curl -fsSL https://github.com/ai-ecoverse/slicc-cdp/releases/latest/download/install.sh | sh -s -- --dir /tmp/smoke-bin

      - name: Verify
        run: |
          /tmp/smoke-bin/playwright-cli --version
          /tmp/smoke-bin/curlwright --version
