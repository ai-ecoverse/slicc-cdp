name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target wasm32-wasip1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: npm run build:wasm

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide crates publish
        id: crates
        run: |
          version=$(node -e "process.stdout.write(require('./package.json').version)")
          if [ "$version" = "0.0.0" ]; then
            git fetch origin --tags --force
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$tag" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "semantic-release did not publish; skipping crates.io"
              exit 0
            fi
            version=${tag#v}
            echo "resuming crate publish for $version"
          fi
          if grep -q 'vendor/wasix-net' crates/cdp-client/Cargo.toml; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "slicc-cdp-client still depends on the vendored wasix-net path; skipping crates.io"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "slicc-cdp (https://github.com/ai-ecoverse/slicc-cdp)" "https://crates.io/api/v1/crates/slicc-cdp-client")
          if [ "$code" = "404" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "slicc-cdp-client is not on crates.io yet; the first publish is manual"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "crates.io lookup for slicc-cdp-client returned $code"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.crates.outputs.publish == 'true'

      - name: Publish crates
        if: steps.crates.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: sh scripts/publish-crates.sh "${{ steps.crates.outputs.version }}"
