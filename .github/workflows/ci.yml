name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
        with:
          script: |
            const hosted = 'ubuntu-latest';
            const pick = async (runner, why) => {
              core.setOutput('runner', runner);
              await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();
            };
            if (process.env.FORCED) return await pick(process.env.FORCED, 'vars.CI_RUNNER');
            const pool = process.env.POOL;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head.repo;
              const same = head && head.full_name === `${owner}/${repo}`;
              return same ? await pick(pool, 'same-repo PR') : await pick(hosted, 'fork PR');
            }
            if (context.eventName === 'merge_group') {
              const base = context.payload.merge_group.base_ref.replace('refs/heads/', '');
              const q = await github.graphql(
                `query($o:String!,$n:String!,$b:String!){repository(owner:$o,name:$n){mergeQueue(branch:$b){entries(first:100){nodes{pullRequest{number isCrossRepository}}}}}}`,
                { o: owner, n: repo, b: base }
              );
              const entries = q.repository.mergeQueue?.entries?.nodes ?? [];
              const forks = entries.filter((e) => e.pullRequest?.isCrossRepository !== false);
              return forks.length === 0
                ? await pick(pool, `merge group, ${entries.length} same-repo entries`)
                : await pick(hosted, `merge group with a fork or unknown PR: ${forks.map((e) => e.pullRequest?.number).join(', ')}`);
            }
            if (context.eventName === 'push' && context.ref === 'refs/heads/main') return await pick(pool, 'push to main');
            await pick(hosted, context.eventName);

  ci:
    needs: runner
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.14.0
    with:
      chromium: false
      runs-on: ${{ needs.runner.outputs.runner }}
  integration:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target wasm32-wasip1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Chrome for Testing (pinned in package.json config.chrome)
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then deps=--with-deps; else deps=; fi
          npm run -s browser -- $deps
      - run: npm run test:integration

  integration-chrome-latest:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target wasm32-wasip1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Chrome for Testing (latest)
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then deps=--with-deps; else deps=; fi
          echo "CHROMIUM_EXECUTABLE=$(node src/cli.js install-browser --channel stable $deps)" >> "$GITHUB_ENV"
      - name: Run WebMCP integration tests
        run: |
          cargo build -p slicc-cdp -p curlwright
          node --test --test-timeout=600000 test/integration/webmcp.test.mjs

  shellcheck:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: shellcheck -s sh install.sh

  build-binaries:
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: "99.0.0"

  installer-ubuntu:
    needs: [runner, build-binaries]
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/serve
          pattern: binaries-linux-amd64
          merge-multiple: true

      - name: Prepare assets
        run: cd /tmp/serve && sha256sum * > SHA256SUMS

      - name: Start server
        run: |
          python3 -m http.server 8399 --directory /tmp/serve &
          sleep 1

      - name: Install with curl
        run: sh install.sh --version 99.0.0 --dir /tmp/test-bin
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Verify version output
        run: |
          /tmp/test-bin/playwright-cli --version | grep "99.0.0"
          /tmp/test-bin/curlwright --version | grep "99.0.0"

      - name: TLS verified HTTPS exchange
        run: |
          output=$(/tmp/test-bin/playwright-cli --cdp https://example.com/ list 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "HTTP 404"

      - name: TLS rejects invalid certificate
        run: |
          output=$(/tmp/test-bin/playwright-cli --cdp https://self-signed.badssl.com/ tab-list 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "TLS handshake with self-signed.badssl.com failed"

      - name: Tampered asset refusal
        run: |
          cp /tmp/serve/curlwright-linux-amd64 /tmp/serve/curlwright-linux-amd64.bak
          cp /tmp/serve/SHA256SUMS /tmp/serve/SHA256SUMS.good
          printf "tampered" > /tmp/serve/curlwright-linux-amd64
          if sh install.sh --version 99.0.0 --dir /tmp/test-bin-tamper 2>/dev/null; then
            echo "should have failed on tampered asset"
            exit 1
          fi
          cp /tmp/serve/SHA256SUMS.good /tmp/serve/SHA256SUMS
          cp /tmp/serve/curlwright-linux-amd64.bak /tmp/serve/curlwright-linux-amd64
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Custom INSTALL_DIR
        run: |
          sh install.sh --version 99.0.0 --dir /tmp/custom-dir
          /tmp/custom-dir/playwright-cli --version | grep "99.0.0"
          /tmp/custom-dir/curlwright --version | grep "99.0.0"
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Idempotent re-run
        run: |
          sh install.sh --version 99.0.0 --dir /tmp/custom-dir
          /tmp/custom-dir/playwright-cli --version | grep "99.0.0"
          /tmp/custom-dir/curlwright --version | grep "99.0.0"
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

  installer-macos:
    needs: build-binaries
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/serve
          pattern: binaries-darwin-arm64
          merge-multiple: true

      - name: Prepare assets
        run: cd /tmp/serve && shasum -a 256 * > SHA256SUMS

      - name: Start server
        run: |
          python3 -m http.server 8399 --directory /tmp/serve &
          sleep 1

      - name: Install with curl
        run: sh install.sh --version 99.0.0 --dir /tmp/test-bin
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Verify version output
        run: |
          /tmp/test-bin/playwright-cli --version | grep "99.0.0"
          /tmp/test-bin/curlwright --version | grep "99.0.0"

      - name: Tampered asset refusal
        run: |
          cp /tmp/serve/curlwright-darwin-arm64 /tmp/serve/curlwright-darwin-arm64.bak
          cp /tmp/serve/SHA256SUMS /tmp/serve/SHA256SUMS.good
          printf "tampered" > /tmp/serve/curlwright-darwin-arm64
          if sh install.sh --version 99.0.0 --dir /tmp/test-bin-tamper 2>/dev/null; then
            echo "should have failed on tampered asset"
            exit 1
          fi
          cp /tmp/serve/SHA256SUMS.good /tmp/serve/SHA256SUMS
          cp /tmp/serve/curlwright-darwin-arm64.bak /tmp/serve/curlwright-darwin-arm64
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Custom INSTALL_DIR
        run: |
          sh install.sh --version 99.0.0 --dir /tmp/custom-dir
          /tmp/custom-dir/playwright-cli --version | grep "99.0.0"
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Idempotent re-run
        run: |
          sh install.sh --version 99.0.0 --dir /tmp/custom-dir
          /tmp/custom-dir/playwright-cli --version | grep "99.0.0"
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

  installer-alpine:
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup
        run: apk add --no-cache wget python3 ca-certificates

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/serve
          pattern: binaries-linux-amd64
          merge-multiple: true

      - name: Prepare assets
        run: cd /tmp/serve && sha256sum * > SHA256SUMS

      - name: Start server
        run: |
          python3 -m http.server 8399 --directory /tmp/serve &
          sleep 1

      - name: Install with wget
        run: sh install.sh --version 99.0.0 --dir /tmp/test-bin
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Verify version output
        run: |
          /tmp/test-bin/playwright-cli --version | grep "99.0.0"
          /tmp/test-bin/curlwright --version | grep "99.0.0"

      - name: TLS verified HTTPS exchange
        run: |
          output=$(/tmp/test-bin/playwright-cli --cdp https://example.com/ list 2>&1) || true
          echo "$output"
          echo "$output" | grep -q "HTTP 404"

      - name: Tampered asset refusal
        run: |
          cp /tmp/serve/curlwright-linux-amd64 /tmp/serve/curlwright-linux-amd64.bak
          cp /tmp/serve/SHA256SUMS /tmp/serve/SHA256SUMS.good
          printf "tampered" > /tmp/serve/curlwright-linux-amd64
          if sh install.sh --version 99.0.0 --dir /tmp/test-bin-tamper 2>/dev/null; then
            echo "should have failed on tampered asset"
            exit 1
          fi
          cp /tmp/serve/SHA256SUMS.good /tmp/serve/SHA256SUMS
          cp /tmp/serve/curlwright-linux-amd64.bak /tmp/serve/curlwright-linux-amd64
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Custom INSTALL_DIR
        run: |
          sh install.sh --version 99.0.0 --dir /tmp/custom-dir
          /tmp/custom-dir/playwright-cli --version | grep "99.0.0"
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399

      - name: Idempotent re-run
        run: |
          sh install.sh --version 99.0.0 --dir /tmp/custom-dir
          /tmp/custom-dir/playwright-cli --version | grep "99.0.0"
        env:
          SLICC_INSTALL_BASE_URL: http://127.0.0.1:8399
