name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  attestations: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.7.8
    secrets: inherit
    with:
      test-glob: test/integration/*.test.mjs
      shards: 4
      timeout-minutes: 30
      review-timeout-minutes: 90
      review-prompt: |
        SLICC-CDP

        This repository is slicc-cdp: the npm package `@ai-ecoverse/slicc-cdp` (the Node `CDPClient`, `connect`, `slicc-cdp install-browser` and `find-browser`, and the kernel wasm builds `bin/playwright-cli.wasm` and `bin/curlwright.wasm`), the Rust crates `slicc-cdp-client`, `slicc-discovery`, `slicc-cdp` (`playwright-cli`) and `curlwright` on crates.io, the native binaries and `install.sh` on the GitHub release, and `@ai-ecoverse/sliccy-browser` in `packages/sliccy-browser`. AGENTS.md and the README are the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        There is no certification after you: once this pull request passes the merge queue, semantic-release publishes it to npm from `main`, then the crates and the signed binaries follow. Seven ships `playwright-cli` and `curlwright` in its base set, and every repository's CI on slicc-shared-web's pipeline installs Chrome with the latest `slicc-cdp install-browser`. Review it as the last check before it ships.

        Look for real defects, in this order:
        1. The guard: seven's origins, the vault, browser pages, extensions and local files stay out of reach in every path (tabs, frames, redirects, popups, `Fetch`, cookies, headers, console, saved sessions, WebMCP), protected cookies and their values never leak, and a refusal fails closed. Check the Rust guard in `crates/cdp-client` and the Node client in `src/` both.
        2. Connecting: `--cdp`, then `SLICC_CDP_URL`, then a seven-profiles port, then a loopback session in the user config dir; a cwd session file is ignored, saved state never dials a remote host, probes and launch stay on 9222 to 9229, `ws`/`wss` dial and `http` discovers, a non-2xx exits non-zero, and the wasm builds use 9222 and have no TLS.
        3. Compatibility for consumers: Microsoft playwright-cli's commands, flags and output for what we claim to match, curl's for curlwright, the public Node entry and its types, the crates' public API, `install.sh` and the release asset names, and `slicc.commands` in `package.json`.
        4. Correctness of CDP use: flat sessions with a top-level `sessionId`, no `/devtools/page/<id>` socket, races between targets, sessions and events, and promises or reads that never end.
        5. Tests: every behaviour change has an integration test in `test/integration/` or a `#[cfg(test)]` test, and a fix's test fails without the fix. Confirm that for a fix: copy the changed test files into `$RUNNER_TEMP/base`, build it and run them there.
        6. Repo rules: no comments anywhere (YAML too, except `# renovate:` annotations), no unit tests in git (`test/unit/` is ignored), and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).

        Build a tree before you run its tests: `cargo build --locked -p slicc-cdp -p curlwright` and `cargo build --locked --target wasm32-wasip1 -p slicc-cdp -p curlwright`, then run one file with `node --import ./test/integration/ports.mjs --test --test-timeout=600000 test/integration/<file>.test.mjs`. Don't report style preferences, or anything you haven't confirmed in the code or by a run.

        Severity: deny for a confirmed P1 or P2: a guard bypass or a leak of a protected cookie or secret, a dial to a remote host from saved state, a crash or a command that no longer runs in seven's kernel, a regression in a common command without a workaround, a behaviour change without its test, or a fix whose test passes without it. A narrow problem with a workaround is P3: comment with a repro and approve. A problem in seven's pins belongs to ai-ecoverse/slicc-bios, one in the guard vectors to ai-ecoverse/slicc-browsers: open it there as an issue.

  released:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: version
        run: |
          git fetch --tags --force --quiet origin
          version=$(git tag --points-at HEAD --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release: ${version:-none} at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  crates:
    needs: released
    if: needs.released.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - run: rustup toolchain install "$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)" --profile minimal

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
        id: auth

      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.released.outputs.version }}
        run: sh scripts/publish-crates.sh "$VERSION"

  binaries:
    needs: released
    if: needs.released.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: x86_64-apple-darwin, label: darwin-amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, label: darwin-arm64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, label: linux-amd64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, label: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-amd64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, label: windows-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Stamp version
        env:
          VERSION: ${{ needs.released.outputs.version }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)" --profile minimal --target "$TARGET"

      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          build=cargo
          [ "$TARGET" = aarch64-unknown-linux-musl ] && build=cross
          "$build" build --locked --release --target "$TARGET" -p slicc-cdp -p curlwright
          ext=
          [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p dist
          cp "target/$TARGET/release/playwright-cli$ext" "dist/playwright-cli-$LABEL$ext"
          cp "target/$TARGET/release/curlwright$ext" "dist/curlwright-$LABEL$ext"

      - name: Sign, notarise and check Gatekeeper
        if: runner.os == 'macOS'
        env:
          LABEL: ${{ matrix.label }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          scripts/sign-macos.sh "ai.sliccy.playwright-cli:dist/playwright-cli-$LABEL" "ai.sliccy.curlwright:dist/curlwright-$LABEL"
          for bin in "dist/playwright-cli-$LABEL" "dist/curlwright-$LABEL"; do
            codesign -dv --verbose=2 "$bin" 2>&1 | grep -q 'Authority=Developer ID Application'
            spctl -a -vv -t install "$bin" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binaries-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  assets:
    needs: [released, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Notices, licence, installer and checksums
        run: |
          rustup toolchain install "$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)" --profile minimal
          bash scripts/generate-notices.sh artifacts/THIRD-PARTY-NOTICES
          cp LICENSE install.sh artifacts/
          node scripts/release-checksums.mjs artifacts

      - name: Upload every asset, then publish the draft release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.released.outputs.version }}
        run: |
          expected="SHA256SUMS install.sh LICENSE THIRD-PARTY-NOTICES"
          for bin in playwright-cli curlwright; do
            for label in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do expected="$expected $bin-$label"; done
            expected="$expected $bin-windows-amd64.exe $bin-windows-arm64.exe"
          done
          for name in $expected; do test -f "artifacts/$name" || { echo "::error::missing asset $name"; exit 1; }; done
          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          uploaded=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for name in $expected; do printf '%s\n' "$uploaded" | grep -qx "$name" || { echo "::error::$name is not on $TAG"; exit 1; }; done
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  sliccy-browser:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish sliccy-browser when its version is not on npm yet
        working-directory: packages/sliccy-browser
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          npm publish --access public --ignore-scripts
          git push origin "$GITHUB_SHA:refs/tags/sliccy-browser-v$version"
          echo "published $name@$version and tagged sliccy-browser-v$version" >> "$GITHUB_STEP_SUMMARY"
