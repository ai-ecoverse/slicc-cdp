name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.12.0
    with:
      chromium: false
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --target wasm32-wasip1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Chromium
        run: |
          npx playwright-core install-deps chromium
          npx playwright-core install chromium
      - run: npm run test:integration
