name: Flake proof

on:
  push:
    branches: [fix/611-har-stop-headed-focus]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          git show 8b36aaf:crates/playwright-cli/src/har.rs > crates/playwright-cli/src/har.rs
          git show 8b36aaf:crates/playwright-cli/src/landing.rs > crates/playwright-cli/src/landing.rs
          git show 8b36aaf:crates/playwright-cli/src/landing.js > crates/playwright-cli/src/landing.js
          cargo build --locked -j 4 -p slicc-cdp -p curlwright
          set +e
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 --test-name-pattern='HAR stop retains' test/integration/har-fake.test.mjs
          har_status=$?
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 --test-name-pattern='native: Tab waits' test/integration/headed-input-fake.test.mjs
          tab_status=$?
          set -e
          test "$har_status" -ne 0
          test "$tab_status" -ne 0
          git restore crates/playwright-cli/src/har.rs crates/playwright-cli/src/landing.rs crates/playwright-cli/src/landing.js
          cargo build --locked -j 4 -p slicc-cdp -p curlwright
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 --test-name-pattern='HAR stop retains|native: Tab waits' test/integration/har-fake.test.mjs test/integration/headed-input-fake.test.mjs
  repeat:
    runs-on: cloud-run-job
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: [har-chrome, headed-input, page-scope-filtered-parent-chrome]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser --with-deps
          if ! command -v Xvfb; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb
            else sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            fi
          fi
      - run: npm run pretest
        env:
          CARGO_BUILD_JOBS: '4'
      - run: |
          for round in $(seq 1 20); do
            echo "Proof round $round: $FILE"
            node --import ./test/integration/ports.mjs --test --test-concurrency=1 --test-timeout=600000 "test/integration/$FILE.test.mjs"
          done
        env:
          FILE: ${{ matrix.file }}
          CI: 'true'
