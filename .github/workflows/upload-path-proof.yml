name: Upload path proof

on:
  push:
    branches: [proof/609-upload-original-row]

permissions:
  contents: read

jobs:
  proof:
    runs-on: cloud-run-job
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps}
          command -v Xvfb
      - run: |
          git show 13ab3a2:crates/playwright-cli/src/browser.rs > crates/playwright-cli/src/browser.rs
          cargo build --locked -j 4 -p slicc-cdp -p curlwright
          set +e
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 test/integration/upload-path-fake.test.mjs
          fake_status=$?
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 test/integration/page-scope-filtered-parent-chrome.test.mjs
          chrome_status=$?
          set -e
          test "$fake_status" -ne 0
          test "$chrome_status" -ne 0
          git restore crates/playwright-cli/src/browser.rs
          cargo build --locked -j 4 -p slicc-cdp -p curlwright
          cargo test --locked -j 4 -p slicc-cdp native_upload -- --test-threads=1
          node --import ./test/integration/ports.mjs --test --test-concurrency=1 test/integration/upload-path-fake.test.mjs
          for round in $(seq 1 20); do
            echo "Absolute upload Chrome round $round"
            node --import ./test/integration/ports.mjs --test --test-concurrency=1 test/integration/page-scope-filtered-parent-chrome.test.mjs
          done
          git show 13ab3a2:test/integration/page-scope-filtered-parent-chrome.test.mjs > test/integration/page-scope-filtered-parent-chrome.test.mjs
          for round in $(seq 1 100); do
            echo "Unchanged original Chrome row $round"
            node --import ./test/integration/ports.mjs --test --test-concurrency=1 test/integration/page-scope-filtered-parent-chrome.test.mjs
          done
